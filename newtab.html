<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="newtab">
<canvas id="bg"></canvas>
<!-- Chat glass: the panel refracts what is behind it through this filter (Refraction = scale, Ripple = frequency). -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <filter id="glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence id="glass-noise" type="fractalNoise" baseFrequency="0.007" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap id="glass-map" in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<main class="hero">
  <div class="avatar" aria-hidden="true"></div>
  <h1 id="greeting"></h1>
  <form id="search" role="search">
    <div class="row">
      <svg class="mag" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Ask anything..." aria-label="Search" autocomplete="off" spellcheck="false" autofocus
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg">
    </div>
    <div class="row tools">
      <span id="msg" class="msg" role="status"></span>
      <button id="mic" class="tool" type="button" aria-label="Search by voice" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="lens" class="tool" type="button" aria-label="Search by image">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
      </button>
    </div>
    <ul id="sugg" class="sugg" role="listbox" aria-label="Search suggestions" hidden></ul>
  </form>
</main>
<script src="engine.js"></script>
<script src="newtab.js"></script>
</body>
</html>
